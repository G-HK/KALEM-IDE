[language]
id = "cpp"
name = "C / C++"
extensions = ["c", "h", "cpp", "hpp", "cc", "cxx"]
grammar = "tree-sitter-cpp"

[lsp]
command = "clangd"

[debug]
adapter = "lldb-dap"
[debug.linux]
adapter = "gdb"        # gdb in DAP mode: gdb --interpreter=dap

[detect]
project_files = ["CMakeLists.txt", "Makefile", "meson.build"]

[tasks]
build = "cmake --build build"
run = "./build/app"
test = "ctest --test-dir build"
