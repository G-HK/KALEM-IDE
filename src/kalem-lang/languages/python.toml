[language]
id = "python"
name = "Python"
extensions = ["py", "pyi"]
grammar = "tree-sitter-python"

[lsp]
command = "pyright-langserver"
args = ["--stdio"]

[debug]
adapter = "debugpy"

[detect]
project_files = ["pyproject.toml", "requirements.txt", "setup.py"]

[tasks]
run = "python main.py"
test = "pytest"
