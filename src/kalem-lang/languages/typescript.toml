[language]
id = "typescript"
name = "TypeScript / JavaScript"
extensions = ["ts", "tsx", "js", "jsx", "mjs", "cjs"]
grammar = "tree-sitter-typescript"

[lsp]
command = "typescript-language-server"
args = ["--stdio"]

[debug]
adapter = "js-debug"

[detect]
project_files = ["package.json", "tsconfig.json"]

[tasks]
build = "npm run build"
run = "npm start"
test = "npm test"
