[package]
name = "kalem-ui"
description = "Kalem IDE desktop app (GPUI)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "kalem-ide"
path = "src/main.rs"

[dependencies]
kalem-core = { path = "../kalem-core" }
kalem-workspace = { path = "../kalem-workspace" }
kalem-theme = { path = "../kalem-theme" }
kalem-vcs = { path = "../kalem-vcs" }
kalem-test = { path = "../kalem-test" }
kalem-dap = { path = "../kalem-dap" }
kalem-lsp = { path = "../kalem-lsp" }
anyhow = "1"
gpui-kit = { version = "0.7", features = [
  "tree-sitter-rust", "tree-sitter-python", "tree-sitter-javascript", "tree-sitter-typescript",
  "tree-sitter-tsx", "tree-sitter-go", "tree-sitter-java", "tree-sitter-kotlin", "tree-sitter-c",
  "tree-sitter-cpp", "tree-sitter-csharp", "tree-sitter-toml", "tree-sitter-markdown",
  "tree-sitter-yaml", "tree-sitter-bash", "tree-sitter-html", "tree-sitter-css",
  "tree-sitter-php", "tree-sitter-ruby", "tree-sitter-lua", "tree-sitter-make",
  "tree-sitter-cmake", "tree-sitter-diff", "tree-sitter-proto", "tree-sitter-graphql",
  "tree-sitter-scala",
] }
# Razor (.razor / .cshtml) has no grammar in the toolkit: it is registered at start-up.
tree-sitter = "0.26"
tree-sitter-c-sharp = "0.23"
tree-sitter-razor-modern = "0.1"

# Windows only: puts the Kalem icon into kalem-ide.exe (Explorer, taskbar, Alt+Tab).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
