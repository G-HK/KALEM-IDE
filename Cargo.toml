[workspace]
resolver = "2"
members = ["src/kalem", "src/kalem-*", "tests"]
# `cargo build/test/clippy` without -p skips the GUI crate: GPUI is heavy and needs system libraries.
# Build it explicitly with `cargo build -p kalem-ui`.
default-members = [
  "src/kalem", "src/kalem-core", "src/kalem-dap", "src/kalem-lang", "src/kalem-lsp",
  "src/kalem-solution", "src/kalem-test", "src/kalem-theme", "src/kalem-vcs", "src/kalem-workspace", "tests",
]
# Throw-away UI experiments with heavy dependencies: kept out of the main build and CI.
exclude = ["spikes"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/OWNER/kalem-ide"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
