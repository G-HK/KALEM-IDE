[workspace]
resolver = "2"
members = ["src/kalem", "src/kalem-*", "tests"]
# Throw-away UI experiments with heavy dependencies: kept out of the main build and CI.
exclude = ["spikes"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/OWNER/kalem-ide"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
