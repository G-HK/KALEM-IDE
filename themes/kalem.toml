# Built-in theme "Kalem": the two basic palettes. Copy this file into your themes folder, change
# `name` and any colours you like; anything you leave out falls back to "Kalem".
# Colours are "#RRGGBB". Every theme has a [light] and a [dark] palette.
name = "Kalem"

# --- Light: the Black Panda palette.
#   Ink #0A0A0A, Paper #FFFFFF, PaperTint #F7F7F4, CardTint #ECECE6, Divider #D8D8D1,
#   TextMuted #6A6A63, Bamboo #B9FF66 (brand accent), BambooDeep #6FAA28 (accent readable on light).
[light]
background = "#FFFFFF"     # Paper
panel = "#F7F7F4"          # PaperTint
foreground = "#0A0A0A"     # Ink
muted_foreground = "#6A6A63"  # TextMuted
border = "#D8D8D1"         # Divider
list_active = "#ECECE6"    # CardTint
accent = "#6FAA28"         # BambooDeep: focus border, active tab line (Bamboo itself is too pale on white)
success = "#1F8A5B"
warning = "#E0A100"
danger = "#D7263D"
folder = "#6A6A63"
project = "#2A6FDB"        # Info
solution = "#6FAA28"
lock = "#6A6A63"
# Tab colours per project: each project gets the next colour.
tab1 = "#2A6FDB"
tab2 = "#1F8A5B"
tab3 = "#D7263D"
tab4 = "#E0A100"
tab5 = "#8B5CF6"
tab6 = "#0E9AA7"
tab7 = "#D9480F"
tab8 = "#6A6A63"
[light.badges]            # per file type; keys are the badge labels in lower case
yml = "#D7263D"

# --- Dark: basic dark.
[dark]
background = "#1e1e1e"
panel = "#252526"
foreground = "#e6e6e6"
muted_foreground = "#9aa0a6"
border = "#3a3a3d"
list_active = "#37373d"
accent = "#B9FF66"        # Bamboo (Black Panda green)
success = "#68c868"
warning = "#e5c07b"
danger = "#f44747"
folder = "#dcb67a"
project = "#75beff"
solution = "#B9FF66"
lock = "#75beff"
tab1 = "#4ea1ff"
tab2 = "#4ec9a0"
tab3 = "#f06a6a"
tab4 = "#e5c07b"
tab5 = "#b794f6"
tab6 = "#4dd0e1"
tab7 = "#ff8a4c"
tab8 = "#9aa0a6"
[dark.badges]
yml = "#e0524d"
