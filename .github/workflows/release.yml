name: Release

# Manual only: Actions tab -> Release -> Run workflow, then enter a version like v0.1.0.
# Builds binaries for every OS and attaches them, with SHA256 checksums, to a GitHub Release
# (the tag is created by the release if it does not exist yet).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version/tag, e.g. v0.1.0"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  name: linux-x86_64,   ext: tar.gz }
          - { os: macos-latest,   target: x86_64-apple-darwin,       name: macos-x86_64,   ext: tar.gz }
          - { os: macos-latest,   target: aarch64-apple-darwin,      name: macos-aarch64,  ext: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    name: windows-x86_64, ext: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release -p kalem --target ${{ matrix.target }}
      - name: Package (unix)
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          NAME=kalem-ide-${VERSION}-${{ matrix.name }}
          mkdir "$NAME"
          cp target/${{ matrix.target }}/release/kalem "$NAME"/
          cp -r languages README.md LICENSE-MIT LICENSE-APACHE "$NAME"/
          tar -czf "$NAME.tar.gz" "$NAME"
          shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
      - name: Package (windows)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: |
          $name = "kalem-ide-$env:VERSION-${{ matrix.name }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/${{ matrix.target }}/release/kalem.exe $name/
          Copy-Item -Recurse languages,README.md,LICENSE-MIT,LICENSE-APACHE $name/
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower() + "  $name.zip" | Out-File "$name.zip.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: kalem-ide-${{ matrix.name }}
          path: |
            kalem-ide-*.tar.gz
            kalem-ide-*.zip
            kalem-ide-*.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          files: dist/*
          generate_release_notes: true
