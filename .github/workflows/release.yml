name: Release

# Manual only: Actions tab -> Release -> Run workflow, then enter a version like v0.1.0.
# Builds binaries for every OS (packaging scripts live in deployments/scripts) and attaches
# them, with SHA256 checksums, to a GitHub Release (the tag is created if it does not exist).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version/tag, e.g. v0.1.0"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  name: linux-x86_64,   unix: true }
          - { os: macos-latest,   target: x86_64-apple-darwin,       name: macos-x86_64,   unix: true }
          - { os: macos-latest,   target: aarch64-apple-darwin,      name: macos-aarch64,  unix: true }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    name: windows-x86_64, unix: false }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release -p kalem --target ${{ matrix.target }}
      - name: Package (unix)
        if: matrix.unix
        shell: bash
        run: bash deployments/scripts/package-unix.sh "$VERSION" "${{ matrix.target }}" "${{ matrix.name }}"
      - name: Package (windows)
        if: ${{ !matrix.unix }}
        shell: pwsh
        run: ./deployments/scripts/package-windows.ps1 -Version $env:VERSION -Target "${{ matrix.target }}" -Name "${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: kalem-ide-${{ matrix.name }}
          path: |
            kalem-ide-*.tar.gz
            kalem-ide-*.zip
            kalem-ide-*.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          files: dist/*
          generate_release_notes: true
