name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The desktop app on Windows. Linux runs it in the Docker job below; macOS is not covered yet.
      - if: runner.os == 'Windows'
        run: cargo clippy -p kalem-ui --all-targets -- -D warnings
      - if: runner.os == 'Windows'
        run: cargo build -p kalem-ui

  # The desktop app on Linux: same check as `docker run ... kalem-linux-check` locally.
  linux-gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t kalem-linux-check deployments/linux
      # No debug info: a full GPUI debug build with it does not fit the runner's free disk comfortably.
      - run: docker run --rm -e CARGO_PROFILE_DEV_DEBUG=0 -e CARGO_PROFILE_TEST_DEBUG=0 -v "$PWD:/src" kalem-linux-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-check
          path: dist/linux-check/
          if-no-files-found: ignore
